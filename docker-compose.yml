# Entorno local de desarrollo para MediTrack Senior.
# Solo levanta PostgreSQL; el backend se ejecuta con Maven (perfil dev).
# Las credenciales se toman del archivo .env de la raiz (no versionado).

services:
  postgres:
    # Version fija de la imagen (no "latest") para builds reproducibles.
    image: postgres:16.6-alpine
    container_name: meditrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - meditrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready confirma que el motor acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  meditrack-pgdata:
