openapi: 3.0.3
info:
  title: MediTrack Senior API
  description: |
    API REST del backend de MediTrack Senior.

    Autenticacion mediante JWT (Bearer). El token se obtiene en
    `POST /api/auth/login` y se envia en el encabezado
    `Authorization: Bearer <token>`.

    Los errores usan un unico formato (ver el esquema `ApiError`).
  version: v1
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo
tags:
  - name: Autenticacion
    description: Inicio de sesion y datos del usuario autenticado
  - name: Usuarios
    description: Administracion de usuarios (solo ADMINISTRADOR)
  - name: Pacientes
    description: Perfiles de adultos mayores (lectura segun alcance; escritura solo ADMINISTRADOR)
  - name: Contactos de emergencia
    description: Contactos de emergencia de un paciente
  - name: Familiares
    description: Vinculacion de familiares con pacientes (solo ADMINISTRADOR)
  - name: Cuidadores
    description: Asignacion de cuidadores a pacientes (solo ADMINISTRADOR)
  - name: Medicamentos
    description: Catalogo de medicamentos (lectura ADMINISTRADOR/CUIDADOR_ENFERMERO; escritura solo ADMINISTRADOR)
  - name: Esquemas de medicacion
    description: Tratamientos de un residente con dosis, frecuencia, via y vigencia, con sus horarios
  - name: Tomas
    description: Agenda del dia, historial y registro de tomas (pendiente/atrasado calculados, nunca persistidos)
  - name: Especialidades
    description: Catalogo de especialidades medicas (solo lectura, los tres roles)
  - name: Citas
    description: Calendario de citas medicas por rango, agendamiento, edicion y cambio de estado (lectura segun alcance)
  - name: Bitacora de signos vitales
    description: Registro diario e historial de signos vitales de un residente (presion, glucosa, temperatura)

paths:
  /api/auth/login:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion y obtener un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Cuerpo de la peticion invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credenciales invalidas o cuenta desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/me:
    get:
      tags: [Autenticacion]
      summary: Datos del usuario autenticado
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAutenticado'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/contrasena:
    put:
      tags: [Autenticacion]
      summary: Cambiar la contrasena del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contrasena actualizada
        '400':
          description: Datos invalidos (contrasena nueva demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: La contrasena actual no es correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios:
    post:
      tags: [Usuarios]
      summary: Crear un usuario (solo ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un usuario con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Usuarios]
      summary: Listar usuarios con filtros por rol y estado (paginado)
      parameters:
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RolNombre'
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUsuario'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario por id (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Usuarios]
      summary: Actualizar nombre, telefono y rol de un usuario (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Regla de negocio violada (ultimo administrador activo o quitarse su propio rol)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar un usuario (solo ADMINISTRADOR; nunca borrado fisico)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo o el motivo supera 200 caracteres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Regla de negocio violada (desactivarse a si mismo o ultimo administrador activo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes:
    post:
      tags: [Pacientes]
      summary: Crear un paciente (solo ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPacienteRequest'
      responses:
        '201':
          description: Paciente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - campos invalidos (por ejemplo, fecha de nacimiento futura),
            fecha de ingreso futura, o residente activo sin situacion clinica (la
            habitacion es opcional: el producto cubre centros de dia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un paciente con ese documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Pacientes]
      summary: Listar pacientes segun el alcance del usuario (paginado)
      parameters:
        - name: texto
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de pacientes dentro del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePacienteResumen'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{id}:
    get:
      tags: [Pacientes]
      summary: Detalle de un paciente segun el alcance del usuario
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El paciente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Pacientes]
      summary: Actualizar los datos de un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPacienteRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - campos invalidos (por ejemplo, fecha de nacimiento futura),
            fecha de ingreso futura, o residente activo sin situacion clinica (la
            habitacion es opcional: el producto cubre centros de dia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Documento duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{id}/estado:
    patch:
      tags: [Pacientes]
      summary: Activar o desactivar un paciente (solo ADMINISTRADOR; nunca borrado fisico)
      description: >-
        La desactivacion es un borrado logico y exige un motivo no vacio
        (maximo 200 caracteres) que queda registrado en la auditoria. La
        activacion no exige motivo: si se envia, se ignora.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo, el motivo supera 200 caracteres,
            el residente a activar no tiene situacion clinica o la fecha de
            ingreso es futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/contactos:
    get:
      tags: [Contactos de emergencia]
      summary: Listar contactos de emergencia (lectura segun alcance)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de contactos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactoEmergencia'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El paciente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Contactos de emergencia]
      summary: Crear un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'
      responses:
        '201':
          description: Contacto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoEmergencia'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/contactos/{contactoId}:
    put:
      tags: [Contactos de emergencia]
      summary: Actualizar un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: contactoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoEmergencia'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o contacto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Contactos de emergencia]
      summary: Eliminar un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: contactoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Contacto eliminado
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o contacto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/familiares:
    get:
      tags: [Familiares]
      summary: Listar familiares vinculados a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de vinculaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VinculacionFamiliar'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Familiares]
      summary: Vincular un familiar a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamiliarRequest'
      responses:
        '201':
          description: Vinculacion creada o reactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinculacionFamiliar'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El familiar ya esta vinculado, el usuario no esta activo o no tiene el rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/familiares/{usuarioId}:
    delete:
      tags: [Familiares]
      summary: Revocar la vinculacion de un familiar (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Vinculacion revocada (autorizado = false)
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Vinculacion no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/cuidadores:
    get:
      tags: [Cuidadores]
      summary: Listar cuidadores con asignacion vigente de un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de asignaciones vigentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsignacionCuidador'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Cuidadores]
      summary: Asignar un cuidador a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuidadorRequest'
      responses:
        '201':
          description: Asignacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionCuidador'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El cuidador ya tiene una asignacion vigente o no tiene el rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/cuidadores/{usuarioId}:
    delete:
      tags: [Cuidadores]
      summary: Desasignar un cuidador (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Asignacion cerrada (hasta = hoy)
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Asignacion vigente no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/medicamentos:
    get:
      tags: [Medicamentos]
      summary: Listar el catalogo de medicamentos (paginado, con busqueda y estado)
      parameters:
        - name: texto
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de medicamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMedicamentos'
        '401':
          description: Falta un token valido
          content:
