      tags: [Especialidades]
      summary: Listar el catalogo de especialidades medicas (los tres roles)
      responses:
        '200':
          description: Lista de especialidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especialidad'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/citas:
    get:
      tags: [Citas]
      summary: Calendario de citas por rango de fechas, segun el alcance del usuario
      description: >-
        Los tres roles pueden leer, pero solo se devuelven citas de residentes
        dentro del alcance del usuario (ADMINISTRADOR ve todas; CUIDADOR_ENFERMERO
        solo residentes con asignacion vigente; FAMILIAR_AUTORIZADO solo residentes
        con vinculacion autorizada). Exige desde <= hasta. Cada elemento es la vista
        completa de la cita (incluye motivo).
      parameters:
        - name: desde
          in: query
          required: true
          description: Inicio del rango (incluido), en ISO-8601 UTC
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: true
          description: Fin del rango (incluido), en ISO-8601 UTC
          schema:
            type: string
            format: date-time
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoCita'
        - name: pacienteId
          in: query
          required: false
          description: >-
            Filtra el calendario a un residente concreto. Si el residente no
            existe o esta fuera del alcance, se responde una pagina vacia
            (total 0) sin revelar su existencia.
          schema:
            type: integer
            format: int64
        - name: pagina
          in: query
          required: false
          description: Numero de pagina (base 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: tamano
          in: query
          required: false
          description: Tamano de pagina (1-100; por encima de 100 se acota a 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Pagina de citas del rango dentro del alcance (detalle de cada cita)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCitas'
        '400':
          description: >-
            VALIDACION - falta desde o hasta, o la fecha desde es posterior a hasta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/citas:
    post:
      tags: [Citas]
      summary: Agendar una cita de un residente (solo ADMINISTRADOR)
      description: >-
        El autor de la cita (registradaPor) se toma del usuario autenticado,
        nunca del cuerpo de la peticion. La cita nace en estado PROGRAMADA. Si se
        indica especialidadId, la especialidad debe existir.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
      responses:
        '201':
          description: Cita agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitaDetalle'
        '400':
          description: >-
            VALIDACION - datos invalidos o la fecha y hora de la cita esta en el
            pasado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: La especialidad no existe, o el residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El residente esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/citas/{citaId}:
    get:
      tags: [Citas]
      summary: Detalle de una cita de un residente (lectura segun alcance)
      description: >-
        La respuesta incluye el motivo de la cita, solo dentro del alcance del
        usuario.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/CitaId'
      responses:
        '200':
          description: Cita encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitaDetalle'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o la cita no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Citas]
      summary: Editar una cita en estado inicial (solo ADMINISTRADOR)
      description: >-
        Solo se edita una cita en estado PROGRAMADA. La fecha y hora no puede
        estar en el pasado. Si se indica especialidadId, debe existir. El autor
        (registradaPor) no se puede modificar desde la peticion.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/CitaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaRequest'
      responses:
        '200':
          description: Cita actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitaDetalle'
        '400':
          description: >-
            VALIDACION - datos invalidos o la fecha y hora de la cita esta en el
            pasado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: La especialidad no existe, o el residente esta fuera de alcance o la cita no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: La cita ya no esta en estado inicial (PROGRAMADA) o el residente esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/citas/{citaId}/estado:
    patch:
      tags: [Citas]
      summary: Cambiar el estado de una cita (ADMINISTRADOR o CUIDADOR_ENFERMERO)
      description: >-
        Destinos validos: CUMPLIDA e INCUMPLIDA (ADMINISTRADOR o
        CUIDADOR_ENFERMERO, solo si la fecha y hora de la cita ya llego) y
        CANCELADA (solo ADMINISTRADOR). Solo se cambia desde el estado inicial
        PROGRAMADA. Registrar PROGRAMADA o REPROGRAMADA como destino no es una
        operacion del producto y responde 400. El FAMILIAR_AUTORIZADO nunca marca
        estado.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/CitaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoCitaRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitaDetalle'
        '400':
          description: >-
            VALIDACION - estado nulo, destino no permitido (PROGRAMADA o
            REPROGRAMADA) o la fecha y hora de la cita aun no ha llegado para
            marcar CUMPLIDA/INCUMPLIDA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: >-
            El usuario no puede marcar estado (familiar) o intenta cancelar sin
            ser ADMINISTRADOR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o la cita no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: La cita ya no esta en estado inicial (PROGRAMADA) o el residente esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/signos-vitales:
    post:
      tags: [Bitacora de signos vitales]
      summary: Registrar signos vitales de un residente (ADMINISTRADOR o CUIDADOR_ENFERMERO)
      description: >-
        El autor (registradoPor) se toma del usuario autenticado, nunca del cuerpo
        de la peticion. El residente debe existir, estar dentro del alcance del
        usuario y estar activo. Se admite un subconjunto de signos, pero al menos
        uno es obligatorio. Los valores fuera de los rangos de plausibilidad y la
        fecha futura responden 400. El registro es inmutable (no hay edicion ni
        borrado).
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignosVitalesRequest'
      responses:
        '201':
          description: Signos vitales registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignosVitalesDetalle'
        '400':
          description: >-
            VALIDACION - ningun signo informado, valor fuera de rango, presion
            diastolica mayor o igual que la sistolica, o fecha de medicion futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado es FAMILIAR_AUTORIZADO (solo lectura)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El residente esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Bitacora de signos vitales]
      summary: Historial paginado de signos vitales de un residente (lectura segun alcance)
      description: >-
        Los tres roles pueden leer, pero solo de residentes dentro del alcance del
        usuario. Orden por fecha descendente (registro mas reciente primero). Los
        filtros desde/hasta son opcionales; si ambos llegan, se exige desde <= hasta.
        Cada elemento es la vista completa del registro.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: desde
          in: query
          required: false
          description: Inicio del rango de medicion (incluido), en ISO-8601 UTC
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          description: Fin del rango de medicion (incluido), en ISO-8601 UTC
          schema:
            type: string
            format: date-time
        - name: pagina
          in: query
          required: false
          description: Numero de pagina (base 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: tamano
          in: query
          required: false
          description: Tamano de pagina (1-100; por encima de 100 se acota a 100)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Pagina del historial dentro del alcance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSignosVitales'
        '400':
          description: VALIDACION - la fecha desde es posterior a hasta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/signos-vitales/ultimo:
    get:
      tags: [Bitacora de signos vitales]
      summary: Ultimo registro de signos vitales del residente (lectura segun alcance)
      description: >-
        Devuelve el registro con la fecha de medicion mas reciente. Los tres roles
        (lectura segun alcance). Responde 404 si el residente esta fuera de alcance
        o si no tiene ningun registro de signos vitales.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Ultimo registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignosVitalesDetalle'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o no tiene registros de signos vitales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PacienteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MedicamentoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EsquemaId:
      name: esquemaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CitaId:
      name: citaId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    RolNombre:
      type: string
      enum: [ADMINISTRADOR, CUIDADOR_ENFERMERO, FAMILIAR_AUTORIZADO]

    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password

    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolNombre'

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEnSegundos:
          type: integer
          format: int64
        usuario:
          $ref: '#/components/schemas/UsuarioAutenticado'

    CambiarContrasenaRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
          format: password
        contrasenaNueva:
          type: string
          format: password
          minLength: 8

    CrearUsuarioRequest:
      type: object
      required: [correo, nombreCompleto, contrasena, rol]
      properties:
        correo:
          type: string
          format: email
        nombreCompleto:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          nullable: true
        contrasena:
          type: string
          format: password
          minLength: 8
        rol:
          $ref: '#/components/schemas/RolNombre'

    ActualizarUsuarioRequest:
      type: object
      required: [nombreCompleto, rol]
      properties:
        nombreCompleto:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          nullable: true
        rol:
          $ref: '#/components/schemas/RolNombre'

    PacienteEstadoRequest:
      type: object
      description: >-
        Estado de un residente. Solo el ADMINISTRADOR puede cambiarlo. La
        desactivacion es un borrado logico que exige un motivo (dato de
        auditoria, Ley 1581); al activar, el motivo se ignora.
      required: [activo]
      properties:
        activo:
          type: boolean
          description: true activa el residente; false lo desactiva (borrado logico).
        motivo:
          type: string
          maxLength: 200
          nullable: true
          description: >-
            Obligatorio solo cuando activo = false (se guarda en la auditoria);
            maximo 200 caracteres. Se ignora al activar.

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        rol:
          $ref: '#/components/schemas/RolNombre'
        activo:
          type: boolean
        ultimoAccesoEn:
          type: string
          format: date-time
          nullable: true
        creadoEn:
          type: string
          format: date-time
          nullable: true
        actualizadoEn:
          type: string
          format: date-time
          nullable: true

    Sexo:
      type: string
      enum: [MASCULINO, FEMENINO, OTRO, NO_ESPECIFICA]

    CrearPacienteRequest:
      type: object
      required: [documento, nombres, apellidos, fechaNacimiento, sexo]
      properties:
        documento:
          type: string
          maxLength: 30
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        fechaNacimiento:
          type: string
          format: date
        sexo:
          $ref: '#/components/schemas/Sexo'
        habitacion:
          type: string
          maxLength: 20
          nullable: true
        situacionClinica:
          type: string
          nullable: true
        fechaIngreso:
          type: string
          format: date
          nullable: true

    PacienteResumen:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
          example: Gomez, Ana
        edad:
          type: integer
        habitacion:
          type: string
          nullable: true
        activo:
          type: boolean

    ContactoEmergencia:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        parentesco:
          type: string
          nullable: true
        telefono:
          type: string
        principal:
          type: boolean

    PacienteDetalle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        documento:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        nombreCompleto:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: integer
        sexo:
          $ref: '#/components/schemas/Sexo'
        habitacion:
          type: string
          nullable: true
        situacionClinica:
          type: string
          nullable: true
        fechaIngreso:
          type: string
          format: date
          nullable: true
        activo:
          type: boolean
        contactos:
          type: array
          items:
            $ref: '#/components/schemas/ContactoEmergencia'

    ContactoRequest:
      type: object
      required: [nombre, telefono]
      properties:
        nombre:
          type: string
          maxLength: 150
        parentesco:
          type: string
          maxLength: 60
          nullable: true
        telefono:
          type: string
          maxLength: 30
        principal:
          type: boolean

    VinculacionFamiliar:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        parentesco:
          type: string
          nullable: true
        autorizado:
          type: boolean

    FamiliarRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64
        parentesco:
          type: string
          maxLength: 60
          nullable: true

    AsignacionCuidador:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
          nullable: true

    CuidadorRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64

    PagePacienteResumen:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/PacienteResumen'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    PageUsuario:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    ViaAdministracion:
      type: string
      enum: [ORAL, SUBCUTANEA, INTRAMUSCULAR, TOPICA, OTRA]

    EstadoToma:
      type: string
      description: Solo ADMINISTRADA u OMITIDA; PENDIENTE y ATRASADA se calculan, no se persisten
      enum: [ADMINISTRADA, OMITIDA]

    EstadoSlotToma:
      type: string
      enum: [PENDIENTE, ATRASADA, ADMINISTRADA, OMITIDA]

    MedicamentoRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 150
        presentacion:
          type: string
          maxLength: 100
          nullable: true

    Medicamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        presentacion:
          type: string
          nullable: true
        activo:
          type: boolean

    PaginaMedicamentos:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Medicamento'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    EsquemaRequest:
      type: object
      required: [medicamentoId, dosis, frecuenciaHoras, via, fechaInicio, horarios]
      properties:
        medicamentoId:
          type: integer
          format: int64
        dosis:
          type: string
          maxLength: 50
        frecuenciaHoras:
          type: integer
          minimum: 1
          maximum: 24
        via:
          $ref: '#/components/schemas/ViaAdministracion'
        indicaciones:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
          description: Nulo = vigencia abierta
        horarios:
          type: array
          minItems: 1
          description: Horas del dia (HH:mm). Cuando 24 es divisible por la frecuencia, deben ser exactamente 24/frecuencia.
          items:
            type: string
            format: time

    EsquemaMedicacion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        medicamentoId:
          type: integer
          format: int64
        medicamentoNombre:
          type: string
          nullable: true
        dosis:
          type: string
        frecuenciaHoras:
          type: integer
        via:
          $ref: '#/components/schemas/ViaAdministracion'
        indicaciones:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        activo:
          type: boolean
        vigente:
          type: boolean
          description: Calculado para la fecha de consulta (no persistido)
        horarios:
          type: array
          items:
            type: string
            format: time

    RegistrarTomaRequest:
      type: object
      required: [fechaHoraProgramada, estado]
      properties:
        fechaHoraProgramada:
          type: string
          format: date-time
          description: Debe corresponder a uno de los horarios del esquema y no ser futura
        estado:
          $ref: '#/components/schemas/EstadoToma'
        observaciones:
          type: string
          nullable: true
          description: Obligatorio cuando el estado es OMITIDA

    RegistroToma:
      type: object
      properties:
        id:
          type: integer
          format: int64
        esquemaId:
          type: integer
          format: int64
        registradoPor:
          type: integer
          format: int64
        fechaHoraProgramada:
          type: string
          format: date-time
        fechaHoraRegistro:
          type: string
          format: date-time
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoToma'
        observaciones:
          type: string
          nullable: true

    PaginaTomas:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/RegistroToma'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    SlotToma:
      type: object
      properties:
        fechaHoraProgramada:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoSlotToma'

    AgendaEsquema:
      type: object
      properties:
        esquemaId:
          type: integer
          format: int64
        medicamentoId:
          type: integer
          format: int64
        medicamentoNombre:
          type: string
          nullable: true
        dosis:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotToma'
    EstadoCita:
      type: string
      description: >-
        Estados persistidos de una cita. PROGRAMADA es el estado inicial;
        CUMPLIDA, INCUMPLIDA y CANCELADA son finales. REPROGRAMADA existe en el
        esquema pero la reprogramacion no es una operacion del producto: no es un
        destino valido al cambiar estado (responde 400).
      enum: [PROGRAMADA, CUMPLIDA, INCUMPLIDA, CANCELADA, REPROGRAMADA]

    DestinoEstadoCita:
      type: string
      description: >-
        Valores admitidos en PATCH .../estado. CUMPLIDA e INCUMPLIDA las marcan
        ADMINISTRADOR y CUIDADOR_ENFERMERO (solo si la fecha y hora ya llego);
        CANCELADA solo el ADMINISTRADOR. PROGRAMADA y REPROGRAMADA no son destinos
        validos.
      enum: [CUMPLIDA, INCUMPLIDA, CANCELADA]

    Especialidad:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string

    CitaRequest:
      type: object
      description: >-
        Cuerpo para agendar o editar una cita. No incluye registradaPor (sale del
        usuario autenticado) ni estado (lo gestiona el dominio).
      properties:
        especialidadId:
          type: integer
          format: int64
          nullable: true
          description: Opcional; si se envia debe existir en el catalogo de especialidades.
        profesional:
          type: string
          maxLength: 150
          nullable: true
        fechaHora:
          type: string
          format: date-time
          description: >-
            Fecha y hora de la cita en ISO-8601. El backend la recibe como Instant
            (se acepta el sufijo Z o un offset, p. ej. 2026-01-20T09:00:00-05:00).
        lugar:
          type: string
          maxLength: 150
          nullable: true
        motivo:
          type: string
          nullable: true

    CambiarEstadoCitaRequest:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/DestinoEstadoCita'

    CitaResumen:
      type: object
      description: >-
        Campos comunes de una cita (sin motivo). Es la base de CitaDetalle, que
        agrega el motivo de la cita.
      properties:
        id:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        especialidadId:
          type: integer
          format: int64
          nullable: true
        especialidadNombre:
          type: string
          nullable: true
        registradaPor:
          type: integer
          format: int64
        profesional:
          type: string
          nullable: true
        fechaHora:
          type: string
          format: date-time
        lugar:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoCita'

    CitaDetalle:
      allOf:
        - $ref: '#/components/schemas/CitaResumen'
        - type: object
          description: Detalle de una cita; agrega el motivo (segun alcance).
          properties:
            motivo:
              type: string
              nullable: true

    PaginaCitas:
      type: object
      description: Pagina del calendario de citas (contenido y total por el mismo filtro).
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/CitaDetalle'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer


    SignosVitalesRequest:
      type: object
      description: >-
        Cuerpo para registrar signos vitales. No incluye registradoPor (sale del
        usuario autenticado). Todos los signos son opcionales por separado, pero al
        menos uno es obligatorio. Los rangos de plausibilidad, la coherencia de la
        presion y la fecha no futura se validan en el backend (400).
      properties:
        fechaHora:
          type: string
          format: date-time
          nullable: true
          description: >-
            Momento de la medicion en ISO-8601. Opcional; si falta, el servidor usa
            el reloj. No puede ser futuro.
        presionSistolica:
          type: integer
          nullable: true
          description: Presion sistolica en mmHg (50-300). Debe ser mayor que la diastolica.
        presionDiastolica:
          type: integer
          nullable: true
          description: Presion diastolica en mmHg (30-200). Debe ser menor que la sistolica.
        glucosaMgDl:
          type: integer
          nullable: true
          description: Glucosa en mg/dL (20-800).
        temperaturaC:
          type: number
          format: double
          nullable: true
          description: Temperatura en grados C (30.0-45.0), con un decimal.
        observaciones:
          type: string
          maxLength: 500
          nullable: true

    SignosVitalesDetalle:
      type: object
      description: >-
        Vista completa de un registro de signos vitales. Incluye el autor
        (registradoPor) y el momento de la medicion (fechaHora). Los campos clinicos
        que no se registraron vienen en null.
      properties:
        id:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        registradoPor:
          type: integer
          format: int64
        fechaHora:
          type: string
          format: date-time
        presionSistolica:
          type: integer
          nullable: true
        presionDiastolica:
          type: integer
          nullable: true
        glucosaMgDl:
          type: integer
          nullable: true
        temperaturaC:
          type: number
          format: double
          nullable: true
        observaciones:
          type: string
          nullable: true

    PaginaSignosVitales:
      type: object
      description: Pagina del historial de signos vitales (contenido y total por el mismo filtro).
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/SignosVitalesDetalle'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        detalles:
          type: array
          nullable: true
          items:
            type: string

security:
  - bearerAuth: []
