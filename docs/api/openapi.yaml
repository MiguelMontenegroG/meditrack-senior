openapi: 3.0.3
info:
  title: MediTrack Senior API
  description: |
    API REST del backend de MediTrack Senior.

    Autenticacion mediante JWT (Bearer). El token se obtiene en
    `POST /api/auth/login` y se envia en el encabezado
    `Authorization: Bearer <token>`.

    Los errores usan un unico formato (ver el esquema `ApiError`).
  version: v1
servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo
tags:
  - name: Autenticacion
    description: Inicio de sesion y datos del usuario autenticado
  - name: Usuarios
    description: Administracion de usuarios (solo ADMINISTRADOR)
  - name: Pacientes
    description: Perfiles de adultos mayores (lectura segun alcance; escritura solo ADMINISTRADOR)
  - name: Contactos de emergencia
    description: Contactos de emergencia de un paciente
  - name: Familiares
    description: Vinculacion de familiares con pacientes (solo ADMINISTRADOR)
  - name: Cuidadores
    description: Asignacion de cuidadores a pacientes (solo ADMINISTRADOR)
  - name: Medicamentos
    description: Catalogo de medicamentos (lectura ADMINISTRADOR/CUIDADOR_ENFERMERO; escritura solo ADMINISTRADOR)
  - name: Esquemas de medicacion
    description: Tratamientos de un residente con dosis, frecuencia, via y vigencia, con sus horarios
  - name: Tomas
    description: Agenda del dia, historial y registro de tomas (pendiente/atrasado calculados, nunca persistidos)

paths:
  /api/auth/login:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion y obtener un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacion correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Cuerpo de la peticion invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credenciales invalidas o cuenta desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/me:
    get:
      tags: [Autenticacion]
      summary: Datos del usuario autenticado
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAutenticado'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/contrasena:
    put:
      tags: [Autenticacion]
      summary: Cambiar la contrasena del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contrasena actualizada
        '400':
          description: Datos invalidos (contrasena nueva demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: La contrasena actual no es correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios:
    post:
      tags: [Usuarios]
      summary: Crear un usuario (solo ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un usuario con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Usuarios]
      summary: Listar usuarios con filtros por rol y estado (paginado)
      parameters:
        - name: rol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RolNombre'
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUsuario'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario por id (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Usuarios]
      summary: Actualizar nombre, telefono y rol de un usuario (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Regla de negocio violada (ultimo administrador activo o quitarse su propio rol)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar un usuario (solo ADMINISTRADOR; nunca borrado fisico)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo, el motivo supera 200 caracteres,
            el residente a activar no tiene situacion clinica o la fecha de
            ingreso es futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Regla de negocio violada (desactivarse a si mismo o ultimo administrador activo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes:
    post:
      tags: [Pacientes]
      summary: Crear un paciente (solo ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPacienteRequest'
      responses:
        '201':
          description: Paciente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - campos invalidos (por ejemplo, fecha de nacimiento futura),
            fecha de ingreso futura, o residente activo sin situacion clinica (la
            habitacion es opcional: el producto cubre centros de dia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un paciente con ese documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Pacientes]
      summary: Listar pacientes segun el alcance del usuario (paginado)
      parameters:
        - name: texto
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de pacientes dentro del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePacienteResumen'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{id}:
    get:
      tags: [Pacientes]
      summary: Detalle de un paciente segun el alcance del usuario
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El paciente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Pacientes]
      summary: Actualizar los datos de un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPacienteRequest'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - campos invalidos (por ejemplo, fecha de nacimiento futura),
            fecha de ingreso futura, o residente activo sin situacion clinica (la
            habitacion es opcional: el producto cubre centros de dia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Documento duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{id}/estado:
    patch:
      tags: [Pacientes]
      summary: Activar o desactivar un paciente (solo ADMINISTRADOR; nunca borrado fisico)
      description: >-
        La desactivacion es un borrado logico y exige un motivo no vacio
        (maximo 200 caracteres) que queda registrado en la auditoria. La
        activacion no exige motivo: si se envia, se ignora.
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteDetalle'
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo, el motivo supera 200 caracteres,
            el residente a activar no tiene situacion clinica o la fecha de
            ingreso es futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/contactos:
    get:
      tags: [Contactos de emergencia]
      summary: Listar contactos de emergencia (lectura segun alcance)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de contactos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactoEmergencia'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El paciente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Contactos de emergencia]
      summary: Crear un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'
      responses:
        '201':
          description: Contacto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoEmergencia'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/contactos/{contactoId}:
    put:
      tags: [Contactos de emergencia]
      summary: Actualizar un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: contactoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoRequest'
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactoEmergencia'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o contacto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Contactos de emergencia]
      summary: Eliminar un contacto de emergencia (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: contactoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Contacto eliminado
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o contacto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/familiares:
    get:
      tags: [Familiares]
      summary: Listar familiares vinculados a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de vinculaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VinculacionFamiliar'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Familiares]
      summary: Vincular un familiar a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamiliarRequest'
      responses:
        '201':
          description: Vinculacion creada o reactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VinculacionFamiliar'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El familiar ya esta vinculado, el usuario no esta activo o no tiene el rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/familiares/{usuarioId}:
    delete:
      tags: [Familiares]
      summary: Revocar la vinculacion de un familiar (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Vinculacion revocada (autorizado = false)
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Vinculacion no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/cuidadores:
    get:
      tags: [Cuidadores]
      summary: Listar cuidadores con asignacion vigente de un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      responses:
        '200':
          description: Lista de asignaciones vigentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsignacionCuidador'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Cuidadores]
      summary: Asignar un cuidador a un paciente (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuidadorRequest'
      responses:
        '201':
          description: Asignacion creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionCuidador'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Paciente o usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El cuidador ya tiene una asignacion vigente o no tiene el rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/cuidadores/{usuarioId}:
    delete:
      tags: [Cuidadores]
      summary: Desasignar un cuidador (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '204':
          description: Asignacion cerrada (hasta = hoy)
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Asignacion vigente no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/medicamentos:
    get:
      tags: [Medicamentos]
      summary: Listar el catalogo de medicamentos (paginado, con busqueda y estado)
      parameters:
        - name: texto
          in: query
          required: false
          schema:
            type: string
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina de medicamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMedicamentos'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El rol no puede listar el catalogo (solo ADMINISTRADOR o CUIDADOR_ENFERMERO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Medicamentos]
      summary: Crear un medicamento en el catalogo (solo ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicamentoRequest'
      responses:
        '201':
          description: Medicamento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe un medicamento con ese nombre (sin distinguir mayusculas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/medicamentos/{id}:
    put:
      tags: [Medicamentos]
      summary: Actualizar un medicamento del catalogo (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/MedicamentoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicamentoRequest'
      responses:
        '200':
          description: Medicamento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Medicamento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ya existe otro medicamento con ese nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/medicamentos/{id}/estado:
    patch:
      tags: [Medicamentos]
      summary: Activar o desactivar un medicamento (solo ADMINISTRADOR; borrado logico)
      parameters:
        - $ref: '#/components/parameters/MedicamentoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo, el motivo supera 200 caracteres,
            el residente a activar no tiene situacion clinica o la fecha de
            ingreso es futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Medicamento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/esquemas:
    get:
      tags: [Esquemas de medicacion]
      summary: Listar los esquemas de un residente (lectura segun alcance)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: activo
          in: query
          required: false
          schema:
            type: boolean
        - name: vigente
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de esquemas del residente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EsquemaMedicacion'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [Esquemas de medicacion]
      summary: Crear un esquema de medicacion con sus horarios (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsquemaRequest'
      responses:
        '201':
          description: Esquema creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsquemaMedicacion'
        '400':
          description: Datos invalidos (frecuencia fuera de 1-24, fecha de fin anterior al inicio, horarios incoherentes con la frecuencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe/fuera de alcance, o el medicamento no existe o esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El residente esta inactivo o ya existe un esquema activo del mismo medicamento con vigencia solapada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/esquemas/{esquemaId}:
    get:
      tags: [Esquemas de medicacion]
      summary: Detalle de un esquema de un residente (lectura segun alcance)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/EsquemaId'
      responses:
        '200':
          description: Esquema encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsquemaMedicacion'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o el esquema no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [Esquemas de medicacion]
      summary: Actualizar un esquema y reemplazar sus horarios (solo ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/EsquemaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsquemaRequest'
      responses:
        '200':
          description: Esquema actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsquemaMedicacion'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o el esquema no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Solapamiento de vigencia, residente inactivo o medicamento del esquema inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/esquemas/{esquemaId}/estado:
    patch:
      tags: [Esquemas de medicacion]
      summary: Activar o suspender un esquema (solo ADMINISTRADOR; borrado logico)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/EsquemaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEstadoRequest'
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: >-
            VALIDACION - se desactivo sin motivo, el motivo supera 200 caracteres,
            el residente a activar no tiene situacion clinica o la fecha de
            ingreso es futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsquemaMedicacion'
        '403':
          description: El usuario autenticado no es ADMINISTRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o el esquema no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/esquemas/{esquemaId}/tomas:
    post:
      tags: [Tomas]
      summary: Registrar la toma de un esquema (ADMINISTRADOR o CUIDADOR_ENFERMERO)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - $ref: '#/components/parameters/EsquemaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTomaRequest'
      responses:
        '201':
          description: Toma registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroToma'
        '400':
          description: Datos invalidos (hora futura, hora que no corresponde a ningun horario del esquema u OMITIDA sin observaciones)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: El usuario autenticado no puede registrar tomas (familiar o sin permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente esta fuera de alcance o el esquema no existe para ese residente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: El esquema no esta activo/vigente o ya existe una toma para esa hora programada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/tomas/agenda:
    get:
      tags: [Tomas]
      summary: Agenda de medicacion del dia de un residente (pendiente/atrasado calculados)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Dia a consultar; por defecto, hoy en la zona del centro
      responses:
        '200':
          description: Agenda por esquema con el estado calculado de cada slot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgendaEsquema'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/pacientes/{pacienteId}/tomas/historial:
    get:
      tags: [Tomas]
      summary: Historial de tomas de un residente, paginado y filtrable (lectura segun alcance)
      parameters:
        - $ref: '#/components/parameters/PacienteId'
        - name: esquemaId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Pagina del historial de tomas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTomas'
        '401':
          description: Falta un token valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: El residente no existe o esta fuera del alcance del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PacienteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MedicamentoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EsquemaId:
      name: esquemaId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    RolNombre:
      type: string
      enum: [ADMINISTRADOR, CUIDADOR_ENFERMERO, FAMILIAR_AUTORIZADO]

    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password

    UsuarioAutenticado:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/RolNombre'

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEnSegundos:
          type: integer
          format: int64
        usuario:
          $ref: '#/components/schemas/UsuarioAutenticado'

    CambiarContrasenaRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
          format: password
        contrasenaNueva:
          type: string
          format: password
          minLength: 8

    CrearUsuarioRequest:
      type: object
      required: [correo, nombreCompleto, contrasena, rol]
      properties:
        correo:
          type: string
          format: email
        nombreCompleto:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          nullable: true
        contrasena:
          type: string
          format: password
          minLength: 8
        rol:
          $ref: '#/components/schemas/RolNombre'

    ActualizarUsuarioRequest:
      type: object
      required: [nombreCompleto, rol]
      properties:
        nombreCompleto:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
          nullable: true
        rol:
          $ref: '#/components/schemas/RolNombre'

    PacienteEstadoRequest:
      type: object
      description: >-
        Estado de un residente. Solo el ADMINISTRADOR puede cambiarlo. La
        desactivacion es un borrado logico que exige un motivo (dato de
        auditoria, Ley 1581); al activar, el motivo se ignora.
      required: [activo]
      properties:
        activo:
          type: boolean
          description: true activa el residente; false lo desactiva (borrado logico).
        motivo:
          type: string
          maxLength: 200
          nullable: true
          description: >-
            Obligatorio solo cuando activo = false (se guarda en la auditoria);
            maximo 200 caracteres. Se ignora al activar.

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        rol:
          $ref: '#/components/schemas/RolNombre'
        activo:
          type: boolean
        ultimoAccesoEn:
          type: string
          format: date-time
          nullable: true
        creadoEn:
          type: string
          format: date-time
          nullable: true
        actualizadoEn:
          type: string
          format: date-time
          nullable: true

    Sexo:
      type: string
      enum: [MASCULINO, FEMENINO, OTRO, NO_ESPECIFICA]

    CrearPacienteRequest:
      type: object
      required: [documento, nombres, apellidos, fechaNacimiento, sexo]
      properties:
        documento:
          type: string
          maxLength: 30
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        fechaNacimiento:
          type: string
          format: date
        sexo:
          $ref: '#/components/schemas/Sexo'
        habitacion:
          type: string
          maxLength: 20
          nullable: true
        situacionClinica:
          type: string
          nullable: true
        fechaIngreso:
          type: string
          format: date
          nullable: true

    PacienteResumen:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCompleto:
          type: string
          example: Gomez, Ana
        edad:
          type: integer
        habitacion:
          type: string
          nullable: true
        activo:
          type: boolean

    ContactoEmergencia:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        parentesco:
          type: string
          nullable: true
        telefono:
          type: string
        principal:
          type: boolean

    PacienteDetalle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        documento:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        nombreCompleto:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: integer
        sexo:
          $ref: '#/components/schemas/Sexo'
        habitacion:
          type: string
          nullable: true
        situacionClinica:
          type: string
          nullable: true
        fechaIngreso:
          type: string
          format: date
          nullable: true
        activo:
          type: boolean
        contactos:
          type: array
          items:
            $ref: '#/components/schemas/ContactoEmergencia'

    ContactoRequest:
      type: object
      required: [nombre, telefono]
      properties:
        nombre:
          type: string
          maxLength: 150
        parentesco:
          type: string
          maxLength: 60
          nullable: true
        telefono:
          type: string
          maxLength: 30
        principal:
          type: boolean

    VinculacionFamiliar:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        parentesco:
          type: string
          nullable: true
        autorizado:
          type: boolean

    FamiliarRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64
        parentesco:
          type: string
          maxLength: 60
          nullable: true

    AsignacionCuidador:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
          nullable: true

    CuidadorRequest:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: integer
          format: int64

    PagePacienteResumen:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/PacienteResumen'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    PageUsuario:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    ViaAdministracion:
      type: string
      enum: [ORAL, SUBCUTANEA, INTRAMUSCULAR, TOPICA, OTRA]

    EstadoToma:
      type: string
      description: Solo ADMINISTRADA u OMITIDA; PENDIENTE y ATRASADA se calculan, no se persisten
      enum: [ADMINISTRADA, OMITIDA]

    EstadoSlotToma:
      type: string
      enum: [PENDIENTE, ATRASADA, ADMINISTRADA, OMITIDA]

    MedicamentoRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 150
        presentacion:
          type: string
          maxLength: 100
          nullable: true

    Medicamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        presentacion:
          type: string
          nullable: true
        activo:
          type: boolean

    PaginaMedicamentos:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Medicamento'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    EsquemaRequest:
      type: object
      required: [medicamentoId, dosis, frecuenciaHoras, via, fechaInicio, horarios]
      properties:
        medicamentoId:
          type: integer
          format: int64
        dosis:
          type: string
          maxLength: 50
        frecuenciaHoras:
          type: integer
          minimum: 1
          maximum: 24
        via:
          $ref: '#/components/schemas/ViaAdministracion'
        indicaciones:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
          description: Nulo = vigencia abierta
        horarios:
          type: array
          minItems: 1
          description: Horas del dia (HH:mm). Cuando 24 es divisible por la frecuencia, deben ser exactamente 24/frecuencia.
          items:
            type: string
            format: time

    EsquemaMedicacion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        medicamentoId:
          type: integer
          format: int64
        medicamentoNombre:
          type: string
          nullable: true
        dosis:
          type: string
        frecuenciaHoras:
          type: integer
        via:
          $ref: '#/components/schemas/ViaAdministracion'
        indicaciones:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
          nullable: true
        activo:
          type: boolean
        vigente:
          type: boolean
          description: Calculado para la fecha de consulta (no persistido)
        horarios:
          type: array
          items:
            type: string
            format: time

    RegistrarTomaRequest:
      type: object
      required: [fechaHoraProgramada, estado]
      properties:
        fechaHoraProgramada:
          type: string
          format: date-time
          description: Debe corresponder a uno de los horarios del esquema y no ser futura
        estado:
          $ref: '#/components/schemas/EstadoToma'
        observaciones:
          type: string
          nullable: true
          description: Obligatorio cuando el estado es OMITIDA

    RegistroToma:
      type: object
      properties:
        id:
          type: integer
          format: int64
        esquemaId:
