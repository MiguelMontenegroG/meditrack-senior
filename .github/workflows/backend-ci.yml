name: Backend CI

# Pruebas y cobertura del backend (Java 21 + Maven + Testcontainers).
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

# Cancela ejecuciones obsoletas del mismo workflow sobre la misma rama.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verificar y cubrir (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers necesita un daemon Docker accesible desde la JVM de
      # pruebas. En los runners de GitHub no hay systemd (systemctl no existe)
      # y el daemon ya viene corriendo como servicio del runner. No se fuerza
      # DOCKER_HOST: se deja el contexto por defecto que expone el runner.
      # Se verifica desde el shell y desde la JVM (Maven) para distinguir si el
      # problema es del entorno Docker o solo de la deteccion de Testcontainers.
      - name: Verificar Docker para Testcontainers
        run: |
          echo "== Shell =="
          echo "DOCKER_HOST=${DOCKER_HOST:-<no definido>}"
          docker version || true
          docker context ls || true
          docker info || true
          echo "== JVM (lo que ve Testcontainers) =="
          ls -l /var/run/docker.sock || true
          getent group docker || true
          id || true

      # Valores ficticios, solo validos en pruebas. En produccion llegan por
      # variables de entorno gestionadas fuera del repositorio.
      - name: Ejecutar pruebas (mvn verify)
        run: mvn -B verify
        working-directory: backend
        env:
          JWT_SECRET: clave-ficticia-de-ci-con-mas-de-32-bytes-para-hs256
          JWT_EXPIRATION_MINUTES: '60'
          CORS_ALLOWED_ORIGINS: http://localhost:5173

      - name: Subir informe de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn
