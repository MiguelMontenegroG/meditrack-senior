# Configuracion comun de la aplicacion (todos los perfiles).
# Los secretos y credenciales NUNCA viven aqui: se leen de variables de entorno.

spring:
  application:
    name: meditrack-backend

  # Carga el .env de la raiz del monorepo cuando se ejecuta en local.
  # optional: no falla si el archivo no existe (por ejemplo, en produccion).
  config:
    import: optional:file:../.env[.properties]

  # Persistencia: el esquema lo gobierna Flyway, JPA solo valida.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Migraciones versionadas del esquema.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Perfil activo por defecto para desarrollo local.
  profiles:
    active: dev

# Puerto unico de la API.
server:
  port: 8080

# Solo se expone el endpoint de salud; el resto de Actuator queda oculto.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Por defecto NO se expone Swagger UI; solo el perfil dev lo habilita.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Bandera usada por SecurityConfig para permitir Swagger sin JWT solo en dev.
meditrack:
  swagger-habilitado: false

  # Generacion automatica de alertas de seguimiento (Proceso 3).
  # Los umbrales de signos vitales son valores de REFERENCIA para disparar una
  # revision, no un diagnostico clinico.
  alertas:
    habilitado: true
    intervalo-ms: 60000
    tolerancia-toma-min: 30
    tolerancia-cita-min: 60
    ventana-signos-horas: 24
    umbrales:
      sistolica-min: 90
      sistolica-max: 180
      diastolica-min: 50
      diastolica-max: 110
      glucosa-min: 70
      glucosa-max: 250
      temperatura-min: 35.0
      temperatura-max: 38.0
