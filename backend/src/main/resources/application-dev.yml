# Perfil de desarrollo local.
# Toda la configuracion sensible se lee de variables de entorno,
# que en local se cargan desde el .env de la raiz del monorepo.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

# En desarrollo se habilita Swagger UI (generacion automatica del OpenAPI).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# En dev, Swagger queda accesible sin JWT para poder probar la API.
meditrack:
  swagger-habilitado: true
