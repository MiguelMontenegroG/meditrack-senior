# Perfil de pruebas de integracion.
# El DataSource lo provee Testcontainers desde BasePruebaPostgres (via
# @DynamicPropertySource), por lo que aqui no se fija ninguna URL ni
# credenciales: asi las pruebas no dependen del .env.
spring:
  jpa:
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
meditrack:
  swagger-habilitado: false
  # En pruebas la generacion automatica de alertas queda deshabilitada: no debe
  # alterar los datos mientras corren las pruebas (se prueba el caso de uso con
  # reloj fijo, no el scheduler).
  alertas:
    habilitado: false
