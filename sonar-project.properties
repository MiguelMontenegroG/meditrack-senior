# ---------------------------------------------------------------------------
# Analisis local de MediTrack Senior con SonarQube (http://localhost:9000).
# Un solo proyecto para backend y frontend (monorepo).
#
# El token NO se escribe aqui: se lee de la variable de entorno SONAR_TOKEN
# que el usuario define en su sesion de PowerShell antes de lanzar el escaner.
#
# Antes de analizar, generar los informes:
#   cd backend  && mvn -B verify
#   cd frontend && npm run test:coverage
# ---------------------------------------------------------------------------

sonar.projectKey=meditrack-senior
sonar.projectName=MediTrack Senior
sonar.projectVersion=0.1.0
sonar.host.url=http://localhost:9000

# --- Fuentes y pruebas -----------------------------------------------------
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.inclusions=backend/src/main/java/**/*.java,frontend/src/**/*.ts,frontend/src/**/*.tsx

# Las pruebas del frontend viven junto al codigo (*.test.ts[x]); se declaran
# como pruebas para que Sonar no las cuente como codigo productivo.
sonar.test.inclusions=backend/src/test/java/**/*.java,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# --- Cobertura -------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Exclusiones globales --------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  backend/src/main/java/**/config/**,\
  backend/src/main/java/**/*Request.java,\
  backend/src/main/java/**/*Response.java,\
  backend/src/main/java/**/*Entity.java,\
  backend/src/main/java/co/edu/uniquindio/meditrack/MeditrackApplication.java,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src/test/**

# --- Codificacion ----------------------------------------------------------
sonar.sourceEncoding=UTF-8
